# ReXGlue manifest for Resident Evil 5 (Xbox 360), ReXGlue v0.10.x format.
# file_path is relative to this file. default.xex is YOUR OWN file, git-ignored, never committed.

[project]
sdk_version = "0.10.0"
name = "re5"

[entrypoint]
file_path = "default.xex"
out_directory_path = "generated"
includes = []

skip_lr = false
skip_msr = false
ctr_as_local = false
xer_as_local = false
cr_as_local = false
reserved_as_local = false
non_argument_as_local = false
non_volatile_as_local = false
generate_exception_handlers = false

[entrypoint.analysis]
max_jump_extension = 65536
data_region_threshold = 16
large_function_threshold = 1048576
exception_handler_funcs = []

